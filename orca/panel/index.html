<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="head">
    <p class="summary" id="summary" aria-live="polite">Loading…</p>
    <div class="tools">
      <label class="sr-only" for="search">Search your requests</label>
      <input id="search" class="search" type="search" placeholder="Search">
      <label class="sr-only" for="project">Project</label>
      <select id="project"></select>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="What to show"></div>
  </header>
  <main id="list"></main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="panel.js"></script>
</body>
</html>
