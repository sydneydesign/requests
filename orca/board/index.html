<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests board</title>
  <link rel="stylesheet" href="../panel/panel.css">
  <link rel="stylesheet" href="board.css">
</head>
<body class="board-page">
  <header class="bhead" id="bhead">
    <h1 class="sr-only">Requests</h1>
    <p class="summary bsummary" id="bsummary" aria-live="polite">Requests</p>
    <div class="ptools" id="btools">
      <button id="bsearchbtn" class="iconbtn" aria-label="Search" aria-expanded="false" title="Search">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="menuwrap">
        <button id="bdisplaybtn" class="iconbtn" aria-label="Display options" aria-expanded="false" aria-controls="bdisplaymenu" title="Display options">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5" cy="4" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="8" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="12" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <div class="menu" id="bdisplaymenu" hidden>
          <div class="menu-row"><label for="bproject">Project</label><select id="bproject"></select></div>
          <div class="menu-row"><span>Done column</span><button class="menu-btn" data-action="clear">Clear it</button></div>
        </div>
      </div>
    </div>
    <div class="switch seg" role="tablist" aria-label="View">
      <button role="tab" data-view="list">List</button>
      <button role="tab" data-view="board">Board</button>
    </div>
    <div class="searchrow bsearchrow" id="bsearchrow" hidden>
      <label class="sr-only" for="bsearch">Search the board</label>
      <input id="bsearch" class="search" type="search" placeholder="Search requests">
    </div>
  </header>
  <main id="main"></main>

  <!-- List view: the sidebar panel itself (panel.js), at a readable width. -->
  <div id="listview" class="listview" hidden>
    <div class="listcol">
      <header class="head">
        <div class="top">
          <p class="summary" id="summary" aria-live="polite">Requests</p>
          <div class="ptools">
            <button id="searchbtn" class="iconbtn" aria-label="Search" aria-expanded="false" title="Search">
              <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <div class="menuwrap">
              <button id="displaybtn" class="iconbtn" aria-label="Display options" aria-expanded="false" aria-controls="displaymenu" title="Display options">
                <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="5" cy="4" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/><circle cx="11" cy="8" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/><circle cx="7" cy="12" r="1.7" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/></svg>
              </button>
              <div class="menu" id="displaymenu" hidden>
                <div class="menu-row"><span>Group by</span>
                  <div class="seg small"><button data-group="project" aria-pressed="true">Project</button><button data-group="status" aria-pressed="false">Status</button></div>
                </div>
                <div class="menu-row"><label for="project">Project</label><select id="project"></select></div>
                <div class="menu-row"><span>Done</span>
                  <div class="seg small"><button data-done="today" aria-pressed="true">Today</button><button data-done="all" aria-pressed="false">All</button></div>
                </div>
              </div>
            </div>
            <div class="seg pswitch" role="tablist" aria-label="View">
              <button role="tab" aria-selected="true">List</button>
              <button role="tab" aria-selected="false" id="openboard" title="Open the board in a full-width tab">Board</button>
            </div>
          </div>
        </div>
        <div class="searchrow" id="searchrow" hidden>
          <label class="sr-only" for="search">Search your requests</label>
          <input id="search" class="search" type="search" placeholder="Search requests">
        </div>
      </header>
      <main id="list"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="../panel/panel.js"></script>
  <script src="board.js"></script>
</body>
</html>
